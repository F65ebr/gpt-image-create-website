<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-Image-2 图像生成</title>
    <script>
        (function() {
            try {
                var t = localStorage.getItem('gpt_image_theme') || 'auto';
                var eff = t;
                if (t === 'auto') {
                    eff = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', eff);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="panel-left">
        <h1>GPT-Image-2</h1>
        <div class="top-row">
            <button class="btn btn-settings" onclick="openSettings()">设置 API</button>
            <select class="btn btn-theme" id="themeSelect" onchange="setTheme(this.value)">
                <option value="auto">颜色：自动</option>
                <option value="light">颜色：浅色</option>
                <option value="dark">颜色：深色</option>
            </select>
        </div>

        <div class="advanced-section">
            <div class="advanced-toggle" onclick="toggleAdvanced()">
                <span>高级选项</span>
                <span class="arrow">&#9662;</span>
            </div>
            <div class="advanced-panel" id="advancedPanel">
            <div class="advanced-panel-clip">
            <div class="advanced-panel-inner">
            <div class="param-row">
                <div class="param-group">
                    <label>模型选择<span class="tooltip">选择用于图像生成的模型。gpt-image-2.5 为默认最新模型，gpt-image-2-4k 支持 4K 分辨率，gpt-image-2 为基础版本。</span></label>
                    <select id="modelSelect">
                        <option value="gpt-image-2.5" selected>gpt-image-2.5 (默认)</option>
                        <option value="gpt-image-2-4k">gpt-image-2-4k</option>
                        <option value="gpt-image-2">gpt-image-2</option>
                    </select>
                </div>
            </div>
            <div class="param-row">
                <div class="param-group">
                    <label>图像比例<span class="tooltip">生成图片的宽高比。1:1 适合头像图标，3:2 横版适合风景横幅，2:3 竖版适合海报壁纸。</span></label>
                    <select id="aspectSelect" onchange="updateResolutions()">
                        <option value="1:1">1:1 (方形)</option>
                        <option value="3:2">3:2 (横版)</option>
                        <option value="2:3">2:3 (竖版)</option>
                        <option value="16:9">16:9 (宽屏)</option>
                        <option value="9:16">9:16 (竖屏)</option>
                        <option value="auto" selected>自动</option>
                    </select>
                </div>
                <div class="param-group">
                    <label>图像分辨率<span class="tooltip">超过 2560×1440（约 368 万像素）的输出属于官方实验性高分辨率，可能更慢或有不同的可用性。</span></label>
                    <select id="sizeSelect">
                        <option value="auto">自动</option>
                    </select>
                </div>
            </div>
            <div class="param-row">
                <div class="param-group">
                    <label>质量<span class="tooltip">影响图片的细节丰富程度和生成耗时。高质量细节更多但更慢更贵，低质量生成快但细节较少。</span></label>
                    <select id="qualitySelect">
                        <option value="auto">自动</option>
                        <option value="max" selected>最高</option>
                        <option value="xhigh">极高</option>
                        <option value="high">高</option>
                        <option value="medium">中</option>
                        <option value="low">低</option>
                    </select>
                </div>
                <div class="param-group">
                    <label>输出格式<span class="tooltip">图片文件格式。PNG 无损；JPEG 体积小、生成更快；WebP 兼顾质量和体积。</span></label>
                    <select id="outputFormat" onchange="updateCompressionControl()">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
            </div>
            <div class="param-row">
                <div class="param-group moderation-group">
                    <label>内容审核<span class="tooltip">OpenAI 的内容安全过滤强度。"自动"为默认审核级别，"宽松"会放宽限制，允许更多创意内容通过。</span></label>
                    <select id="moderationSelect">
                        <option value="auto">自动</option>
                        <option value="low" selected>宽松</option>
                    </select>
                </div>
                <div class="param-group">
                    <label>背景<span class="tooltip">"透明"需要 PNG 或 WebP 格式，选中后会自动切换格式；"不透明"强制填充背景色。</span></label>
                    <select id="backgroundSelect" onchange="updateBackgroundControl()">
                        <option value="auto" selected>自动</option>
                        <option value="transparent">透明</option>
                        <option value="opaque">不透明</option>
                    </select>
                </div>
            </div>
            <div class="param-row">
                <div class="param-group compression-group">
                    <label>压缩级别<span class="tooltip">仅 JPEG 和 WebP 支持，范围为 0–100。PNG 请求不会发送此参数。</span></label>
                    <div class="compression-control is-disabled" id="compressionControl">
                        <input type="range" id="outputCompression" min="0" max="100" value="100" disabled oninput="compressionValue.value=this.value" />
                        <output id="compressionValue">100</output>
                    </div>
                </div>
            </div>
            </div>
            </div>
        </div>
        </div>

        <button class="btn btn-favorites" onclick="openFavorites()">收藏</button>

        <div class="prompt-area">
            <div class="prompt-header">
                <label for="promptInput">提示词</label>
                <button type="button" class="btn-clear-prompt" onclick="clearPrompt()">清除提示词</button>
            </div>
            <textarea id="promptInput" placeholder="描述你想生成的图像..."></textarea>
        </div>

        <div class="btn-row">
            <button class="btn btn-send" id="sendBtn" onclick="generate()">生成图像</button>
            <button class="btn btn-download" id="downloadBtn" disabled onclick="downloadImage()">下载</button>
            <button class="btn btn-clear" id="clearBtn" disabled onclick="confirmClearImage()">清除</button>
        </div>
    </div>

    <div class="panel-right">
        <div class="image-viewer-wrap">
            <div class="image-viewer" id="imageViewer" tabindex="0" onclick="uploadReference()">
                <div class="image-placeholder" id="placeholder">
                    <div class="icon">&#128444;</div>
                    <p>点击此处上传参考图片</p>
                    <p style="font-size:12px;margin-top:4px;color:var(--text-disabled-soft)">或等待生成结果</p>
                </div>
                <img id="resultImage" style="display:none;" />
                <span class="ref-badge" id="refBadge" style="display:none;">
                    参考图 <span class="remove" onclick="removeReference(event)">&#10005;</span>
                </span>
                <div class="loading-overlay" id="loading">
                    <div class="generation-animation" id="generationAnimation" aria-hidden="true"></div>
                    <div class="generation-label" role="status" aria-live="polite">正在生成图像...</div>
                </div>
            </div>
        </div>
        <a class="github-link" href="https://github.com/F65ebr/gpt-image-create-website" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span>F65ebr/gpt-image-create-website</span>
        </a>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>API 设置</h2>
            <label>API Base URL</label>
            <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1" />
            <label>API Token</label>
            <input type="password" id="apiToken" placeholder="sk-..." />
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeSettings()">取消</button>
                <button class="btn btn-save" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay info-modal" id="infoModal" onclick="if(event.target===this)closeInfoModal()">
        <div class="modal">
            <h2>生成完成</h2>
            <div class="info-time" id="infoTime"></div>
            <div class="btn-row">
                <button class="btn btn-save" onclick="closeInfoModal()">关闭</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="favModal" onclick="if(event.target===this)closeFavorites()">
        <div class="modal fav-modal-box">
            <div class="fav-header">
                <input type="text" class="fav-search" id="favSearch" placeholder="搜索标题或提示词..." oninput="renderFavorites()" />
                <button class="fav-sort-btn" id="favSortBtn" onclick="toggleSortMode()">排序</button>
            </div>
            <div class="fav-list-wrap" id="favListWrap">
                <div class="fav-list" id="favList"></div>
            </div>
            <div class="fav-actions">
                <button class="btn btn-primary" onclick="createFavorite()">创建</button>
                <button class="btn" onclick="importFavorites()">导入</button>
                <button class="btn" onclick="exportFavorites()">导出</button>
            </div>
        </div>
    </div>

    <input type="file" id="favFileInput" accept="application/json,.json" style="display:none;" onchange="handleFavImport(event)" />

    <div class="modal-overlay fav-prompt-modal" id="favTitleModal" onclick="if(event.target===this)closeTitleModal()">
        <div class="modal">
            <h2>收藏提示词</h2>
            <label for="favTitleInput">标题</label>
            <input type="text" id="favTitleInput" placeholder="给这条收藏起个名字..." />
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeTitleModal()">取消</button>
                <button class="btn btn-save" onclick="confirmCreateFavorite()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay fav-prompt-modal" id="favImportModal" onclick="if(event.target===this)closeImportModal()">
        <div class="modal">
            <h2>导入收藏</h2>
            <div class="fav-prompt-msg" id="favImportMsg"></div>
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeImportModal()">取消</button>
                <button class="btn btn-save" onclick="resolveImport(false)">覆盖</button>
                <button class="btn btn-primary" onclick="resolveImport(true)">追加</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay fav-prompt-modal" id="favDeleteModal" onclick="if(event.target===this)closeDeleteModal()">
        <div class="modal">
            <h2>删除收藏</h2>
            <div class="fav-prompt-msg" id="favDeleteMsg"></div>
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmDeleteFavorite()">删除</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay fav-prompt-modal" id="favAlertModal" onclick="if(event.target===this)closeFavAlert()">
        <div class="modal">
            <h2 id="favAlertTitle">提示</h2>
            <div class="fav-prompt-msg" id="favAlertMsg"></div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="closeFavAlert()">知道了</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay fav-prompt-modal" id="clearConfirmModal" onclick="if(event.target===this)closeClearConfirm()">
        <div class="modal">
            <h2 id="clearConfirmTitle">确认清除</h2>
            <div class="fav-prompt-msg" id="clearConfirmMsg"></div>
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeClearConfirm()">取消</button>
                <button class="btn btn-primary" onclick="confirmClearAction()">清除</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileUpload(event)" />

    <script src="script.js"></script>
</body>
</html>
